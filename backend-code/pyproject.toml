[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cypher"
version = "0.1.0"
description = "Recover engineering decisions and rejected alternatives from open-source discussions, with exact quotes. Uses only a local Gemma 4 model."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
cypher = "cypher.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["ollama: needs a running Ollama with gemma4 (set CYPHER_LIVE=1)"]
